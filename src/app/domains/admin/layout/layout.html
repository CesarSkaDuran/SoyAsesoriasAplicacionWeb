<mat-sidenav-container>
  <mat-sidenav
    class="w-70 border-r border-neutral-200 scheme-dark dark:border-neutral-800 dark:bg-neutral-900"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [disableClose]="!isMobile()"
    fixedInViewport
    #sidenav="matSidenav"
  >
    <admin-sidebar />
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col lg:h-dvh lg:overflow-hidden">
    <!-- Toolbar -->
    <div class="flex items-center border-b px-4 py-2.5">
      <button
        matIconButton
        (click)="sidenav.toggle()"
      >
        <mat-icon svgIcon="panel-left" />
      </button>

      <div class="mx-3 h-5 border-l"></div>

      <div class="flex items-center gap-x-4 text-sm font-medium">
        <a class="hover:text-primary" [routerLink]="['/admin/appointment']">Calendario</a>
        <a class="hover:text-primary" [routerLink]="['/admin/records']">Nuevo Paciente</a>
        <a class="hover:text-primary" [routerLink]="['/admin/home']">Inicio</a>
      </div>

      <div class="flex-auto"></div>

      <div class="flex items-center gap-x-2">
        <language-switcher />
        <scheme-switcher />
        <notifications />
        <mat-divider
          vertical
          class="mx-1 h-5"
        />
        <button
          mat-button
          [matMenuTriggerFor]="userMenu"
          class="flex items-center gap-x-2"
        >
          <span class="hidden sm:inline">{{ user()?.fullName() }}</span>
          <mat-icon svgIcon="user" />
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout()">
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col lg:min-h-0 lg:flex-auto lg:overflow-auto">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
