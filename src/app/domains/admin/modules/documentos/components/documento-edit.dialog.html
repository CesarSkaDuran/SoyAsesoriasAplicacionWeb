
    <dialog-header title="Editar documento" />
    <mat-dialog-content>
      <form [formGroup]="form" class="flex flex-col gap-y-4 pt-2">
        <mat-form-field>
          <mat-label>Tipo de documento</mat-label>
          <mat-select formControlName="tipo_id">
            @for (t of tipos(); track t.id) {
              <mat-option [value]="t.id">{{ t.nombre }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Nombre del documento</mat-label>
          <input matInput formControlName="nombre" />
        </mat-form-field>

        <div class="grid grid-cols-2 gap-x-4">
          <mat-form-field>
            <mat-label>Versión</mat-label>
            <input matInput formControlName="version" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Fecha de emisión</mat-label>
            <input
              matInput
              [matDatepicker]="picker"
              formControlName="fecha_emision"
            />
            <mat-datepicker-toggle matIconSuffix [for]="picker" />
            <mat-datepicker #picker />
          </mat-form-field>
        </div>

        <mat-form-field>
          <mat-label>Descripción</mat-label>
          <textarea matInput rows="2" formControlName="descripcion"></textarea>
        </mat-form-field>

        @if (isAdmin()) {
          <mat-form-field>
            <mat-label>Estatus</mat-label>
            <mat-select formControlName="estatus">
              <mat-option value="recibido">Recibido</mat-option>
              <mat-option value="en_revision">En revisión</mat-option>
              <mat-option value="rechazado">Rechazado</mat-option>
            </mat-select>
          </mat-form-field>
        }
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button matButton mat-dialog-close>Cancelar</button>
      <button
        matButton="filled"
        [disabled]="form.invalid || saving()"
        (click)="save()"
      >
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </mat-dialog-actions>
