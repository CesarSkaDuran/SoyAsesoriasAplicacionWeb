
    <dialog-header title="Subir documento" />
    <mat-dialog-content>
      <form
        [formGroup]="form"
        class="flex flex-col gap-y-4 pt-2"
      >
        <!-- File picker -->
        <button
          type="button"
          matButton="outlined"
          class="flex h-24 w-full flex-col items-center justify-center gap-y-1 rounded-xl border-2 border-dashed"
          (click)="fileInput.click()"
        >
          <mat-icon svgIcon="cloud-upload" />
          @if (file()) {
            <span class="font-medium">{{ file()!.name }}</span>
            <span class="text-xs text-neutral-500">
              {{ formatSize(file()!.size) }}
            </span>
          } @else {
            <span>Arrastre su archivo aquí o haga clic para seleccionar</span>
            <span class="text-xs text-neutral-500">
              PDF, imágenes, Excel — máx. 20 MB
            </span>
          }
        </button>
        <input
          #fileInput
          type="file"
          class="hidden"
          (change)="onFileSelected($event)"
        />

        <mat-form-field>
          <mat-label>Tipo de documento</mat-label>
          <mat-select formControlName="tipo_id">
            @for (t of tipos(); track t.id) {
              <mat-option [value]="t.id">{{ t.nombre }}</mat-option>
            }
          </mat-select>
          @if (form.controls.tipo_id.hasError('required')) {
            <mat-error>Selecciona el tipo de documento</mat-error>
          }
        </mat-form-field>

        <mat-form-field>
          <mat-label>Nombre del documento (opcional)</mat-label>
          <input
            matInput
            formControlName="nombre"
          />
        </mat-form-field>

        <div class="grid grid-cols-2 gap-x-4">
          <mat-form-field>
            <mat-label>Versión</mat-label>
            <input
              matInput
              formControlName="version"
              placeholder="1.0"
            />
          </mat-form-field>

          <mat-form-field>
            <mat-label>Fecha de emisión (opcional)</mat-label>
            <input
              matInput
              [matDatepicker]="picker"
              formControlName="fecha_emision"
            />
            <mat-datepicker-toggle matIconSuffix [for]="picker" />
            <mat-datepicker #picker />
          </mat-form-field>
        </div>

        <mat-form-field>
          <mat-label>Descripción</mat-label>
          <textarea
            matInput
            rows="2"
            formControlName="descripcion"
          ></textarea>
        </mat-form-field>
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button
        matButton
        mat-dialog-close
      >
        Cancelar
      </button>
      <button
        matButton="filled"
        [disabled]="!file() || form.invalid || uploading()"
        (click)="upload()"
      >
        {{ uploading() ? 'Subiendo…' : 'Confirmar y subir' }}
      </button>
    </mat-dialog-actions>
