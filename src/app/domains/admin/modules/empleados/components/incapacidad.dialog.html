
    <dialog-header title="Reportar incapacidad o licencia" />

    <mat-dialog-content class="mat-typography">
      <form
        [formGroup]="form"
        class="grid grid-cols-2 gap-x-4 pt-2"
      >
        <searchable-select
          class="col-span-2"
          label="EPS"
          [items]="eps()"
          displayKey="nombre"
          formControlName="eps_id"
        />

        <mat-form-field appearance="outline">
          <mat-label>Fecha inicio</mat-label>
          <input
            matInput
            [matDatepicker]="pIni"
            formControlName="fecha_inicio"
          />
          <mat-datepicker-toggle matIconSuffix [for]="pIni" />
          <mat-datepicker #pIni />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha fin</mat-label>
          <input
            matInput
            [matDatepicker]="pFin"
            formControlName="fecha_fin"
          />
          <mat-datepicker-toggle matIconSuffix [for]="pFin" />
          <mat-datepicker #pFin />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="tipo">
            <mat-option value="comun">Común (EPS)</mat-option>
            <mat-option value="laboral">Laboral (ARL)</mat-option>
            <mat-option value="maternidad">Licencia de maternidad</mat-option>
            <mat-option value="paternidad">Licencia de paternidad</mat-option>
            <mat-option value="no_remunerada">Licencia no remunerada</mat-option>
            <mat-option value="vacaciones">Vacaciones disfrutadas</mat-option>
            <mat-option value="otra">Otra</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Días</mat-label>
          <input
            matInput
            type="number"
            formControlName="dias"
          />
        </mat-form-field>

        <mat-form-field class="col-span-2" appearance="outline">
          <mat-label>Valor</mat-label>
          <input
            matInput
            type="number"
            formControlName="valor"
          />
        </mat-form-field>
      </form>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button matButton="text" mat-dialog-close>Cancelar</button>
      <button
        matButton="filled"
        [disabled]="form.invalid || saving"
        (click)="save()"
      >
        Reportar
      </button>
    </mat-dialog-actions>
