
    <dialog-header [title]="isEdit ? 'Editar planilla' : 'Nueva planilla'" />

    <mat-dialog-content class="mat-typography">
      <form
        [formGroup]="form"
        class="grid grid-cols-2 gap-x-4 pt-2"
      >
        <searchable-select
          class="col-span-2"
          label="Empresa"
          [items]="data.empresas || []"
          displayKey="razon_social"
          formControlName="empresa_id"
        />

        <mat-form-field appearance="outline">
          <mat-label>N° planilla</mat-label>
          <input matInput formControlName="numero_planilla" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Periodo</mat-label>
          <input
            matInput
            formControlName="periodo"
            placeholder="ej. 2023-07"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Valor total</mat-label>
          <input
            matInput
            type="number"
            formControlName="valor_total"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha de pago</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            formControlName="fecha_pago"
          />
          <mat-datepicker-toggle matIconSuffix [for]="picker" />
          <mat-datepicker #picker />
        </mat-form-field>
      </form>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button
        matButton="text"
        mat-dialog-close
      >
        Cancelar
      </button>
      <button
        matButton="filled"
        [disabled]="form.invalid || saving"
        (click)="save()"
      >
        {{ isEdit ? 'Guardar' : 'Crear' }}
      </button>
    </mat-dialog-actions>
