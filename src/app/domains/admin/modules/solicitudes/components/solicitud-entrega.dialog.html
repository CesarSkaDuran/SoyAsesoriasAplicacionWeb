
    <dialog-header [title]="'Gestión de la solicitud #' + data.id" />
    <mat-dialog-content>
      <form [formGroup]="form" class="flex flex-col gap-y-4 pt-2">
        <mat-form-field>
          <mat-label>Fecha de entrega</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            formControlName="fecha_entrega"
          />
          <mat-datepicker-toggle matIconSuffix [for]="picker" />
          <mat-datepicker #picker />
          <mat-hint>Fecha compromiso de entrega al cliente</mat-hint>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Observaciones</mat-label>
          <textarea
            matInput
            rows="3"
            formControlName="observaciones"
          ></textarea>
        </mat-form-field>
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button matButton mat-dialog-close>Cancelar</button>
      <button
        matButton="filled"
        [disabled]="saving()"
        (click)="save()"
      >
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </mat-dialog-actions>
